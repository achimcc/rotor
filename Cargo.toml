[package]
name = "rotor"
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Who reads a secret on a NixOS host, and does a rotation reach them?"
repository = "https://github.com/achimcc/rotor"
readme = "README.md"
keywords = ["nixos", "sops", "secrets", "systemd", "cli"]
categories = ["command-line-utilities"]

[dependencies]
lexopt = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The unit loader: a toplevel and its containers, the way systemd sees them.
unit-lint = { git = "https://github.com/achimcc/unit-lint", tag = "v0.1.0", version = "0.1.0" }

[lints.rust]
# No `unsafe` anywhere in this crate, and no `#[allow]` can bring it back.
unsafe_code = "forbid"

[profile.release]
lto = true
